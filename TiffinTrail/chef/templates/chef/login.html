{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chef Studio Login | TiffinTrail</title>
  <link rel="icon" type="image/png" href="{% static 'images/logo.png' %}">
  <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/chef.css' %}">
  <style>
    body.tt-chef-login-bg {
      background: linear-gradient(135deg, #0a1f0d 0%, #153e19 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .tt-login-box {
      max-width: 440px;
      width: 100%;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
      overflow: hidden;
    }
  </style>
</head>
<body class="tt-chef-login-bg">
  <div class="tt-login-box">
    <!-- Header -->
    <div class="p-4 text-center" style="background: linear-gradient(135deg, #1b5e20, #2e7d32); color: white;">
      <img src="{% static 'images/logo.png' %}" alt="TiffinTrail Logo" style="width: 54px; height: 54px; object-fit: contain; border-radius: 12px;" class="mx-auto mb-2 d-block">
      <h4 class="fw-bold mb-1">TiffinTrail</h4>
      <p class="small text-white-50 mb-0">Chef Studio & Kitchen Portal</p>
    </div>

    <!-- Form -->
    <div class="p-4">
      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show small" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      {% endif %}

      <form method="post" action="{% url 'chef:login' %}" novalidate>
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">

        <div class="mb-3">
          <label class="tt-form-label">Chef Username</label>
          <div class="input-group">
            <span class="input-group-text bg-light">‍</span>
            <input type="text" name="username" class="form-control" placeholder="e.g. chef_amrita" required autofocus>
          </div>
        </div>

        <div class="mb-4">
          <label class="tt-form-label">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-light"></span>
            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
          </div>
        </div>

        <button type="submit" class="btn btn-success w-100 fw-bold py-2 shadow-sm mb-3">
          Sign In to Chef Studio →
        </button>
      </form>

      <div class="text-center pt-3 border-top small">
        <span class="text-muted">Want to partner with TiffinTrail as a home chef?</span><br>
        <a href="{% url 'chef:register' %}" class="fw-bold text-success text-decoration-none">
          Register Your Kitchen →
        </a>
      </div>

      <div class="text-center mt-3 small">
        <a href="{% url 'customer:home' %}" class="text-decoration-none text-muted">
          ← Return to Diner Website
        </a>
      </div>
    </div>
  </div>

  <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
