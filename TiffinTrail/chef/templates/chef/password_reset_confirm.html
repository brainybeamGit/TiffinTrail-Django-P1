{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set New Password - Chef Studio | TiffinTrail</title>
  <link rel="icon" type="image/png" href="{% static 'images/logo.png' %}">
  <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/chef.css' %}?v=7.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body.tt-chef-login-bg {
      background: linear-gradient(135deg, #0a1f0d 0%, #153e19 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .tt-login-box {
      max-width: 440px;
      width: 100%;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
      overflow: hidden;
    }
  </style>
</head>
<body class="tt-chef-login-bg">
  <div class="tt-login-box">
    <!-- Header -->
    <div class="p-4 text-center" style="background: linear-gradient(135deg, #1b5e20, #2e7d32); color: white;">
      <img src="{% static 'images/logo.png' %}" alt="TiffinTrail Logo" style="width: 54px; height: 54px; object-fit: contain; border-radius: 12px;" class="mx-auto mb-2 d-block">
      <h4 class="fw-bold mb-1">Chef Studio</h4>
      <p class="small text-white-50 mb-0">Set New Kitchen Password</p>
    </div>

    <!-- Form -->
    <div class="p-4">
      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show small" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      {% endif %}

      <p class="small text-muted mb-4">
        Apne Chef Studio account ke liye naya password banayein (minimum 8 characters).
      </p>

      <form method="post" action="" novalidate>
        {% csrf_token %}

        <div class="mb-3">
          <label class="tt-form-label fw-bold">New Password</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
            <input type="password" name="new_password" class="form-control" placeholder="Minimum 8 characters" minlength="8" required autofocus>
          </div>
        </div>

        <div class="mb-4">
          <label class="tt-form-label fw-bold">Confirm New Password</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="bi bi-shield-check"></i></span>
            <input type="password" name="confirm_password" class="form-control" placeholder="Re-enter password" minlength="8" required>
          </div>
        </div>

        <button type="submit" class="btn btn-success w-100 fw-bold py-2 shadow-sm mb-3">
          Update & Sign In to Chef Studio &rarr;
        </button>
      </form>
    </div>
  </div>

  <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
