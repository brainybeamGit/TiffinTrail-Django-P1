{% extends 'customer/base.html' %}
{% load static %}

{% block title %}Log In | TiffinTrail{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-5 col-md-7">
      <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5" style="border: 1px solid var(--tt-border) !important; background: #ffffff;">
        <div class="text-center mb-4">
          <a href="{% url 'customer:home' %}" class="d-inline-block mb-3 text-decoration-none" title="TiffinTrail">
            <img src="{% static 'images/logo.png' %}" alt="TiffinTrail Logo" style="width: 64px; height: 64px; object-fit: contain; border-radius: 14px;" class="shadow-xs border p-1.5 bg-white">
          </a>
          <h2 class="h4 fw-bold mb-1" style="color: var(--tt-charcoal);">Welcome Back</h2>
          <p class="text-muted small">Log in to manage your tiffin subscriptions and orders.</p>
        </div>

        <form action="" method="post">
          {% csrf_token %}
          <input type="hidden" name="next" value="{{ next }}">

          <div class="mb-3">
            <label class="form-label small fw-semibold text-muted">Username or Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-person"></i></span>
              <input type="text" name="username" class="form-control border-start-0 ps-0" placeholder="Enter username or email" required autofocus>
            </div>
          </div>

          <div class="mb-4">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <label class="form-label small fw-semibold text-muted mb-0">Password</label>
              <a href="{% url 'customer:forgot_password' %}" class="small text-muted text-decoration-none">Forgot Password?</a>
            </div>
            <div class="input-group">
              <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-lock"></i></span>
              <input type="password" name="password" class="form-control border-start-0 ps-0" placeholder="••••••••" required>
            </div>
          </div>

          <button type="submit" class="btn btn-tt-primary w-100 py-2.5 rounded-3 fw-semibold shadow-xs mb-3">
            <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to My Account
          </button>

          <div class="text-center small text-muted">
            New to TiffinTrail?
            <a href="{% url 'customer:register' %}" class="fw-bold text-decoration-none" style="color: var(--tt-primary);">Create an Account</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
