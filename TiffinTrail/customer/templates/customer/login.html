{% extends 'customer/base.html' %}
{% load static %}

{% block title %}Log In | TiffinTrail{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-5 col-md-7">
      <div class="p-4 p-md-5 bg-white rounded-4 border shadow-sm">
        <div class="text-center mb-4">
          <img src="{% static 'images/logo.png' %}" alt="TiffinTrail Logo" style="width: 56px; height: 56px; object-fit: contain; border-radius: 12px;" class="mb-2">
          <h2 class="fs-4 fw-bold mb-1">Welcome Back</h2>
          <p class="text-muted small">Log in to manage your tiffin subscriptions and orders.</p>
        </div>

        <form action="" method="post">
          {% csrf_token %}
          <input type="hidden" name="next" value="{{ next }}">

          <div class="mb-3">
            <label class="form-label small fw-bold">Username or Email Address</label>
            <input type="text" name="username" class="form-control" placeholder="Enter username or email" required autofocus>
          </div>

          <div class="mb-4">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <label class="form-label small fw-bold mb-0">Password</label>
            </div>
            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
          </div>

          <button type="submit" class="btn btn-tt-primary w-100 py-2 fs-6 mb-3">
            Sign In to My Account
          </button>

          <div class="text-center small text-muted">
            New to TiffinTrail?
            <a href="{% url 'customer:register' %}" class="fw-bold text-success text-decoration-none">Create an Account</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
